<!doctype html><html><head><meta charset="utf-8"><title>Passi dei modelli</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js?v=2.3.0"}}</script><style>body{margin:0;background:#e9dfc8}</style></head><body>
<script type="module">
// Strumento di controllo (non fa parte del gioco): un modello in 5 momenti del suo movimento, con il materiale a inchiostro vero.
// ?m=nome  · i fotogrammi: fermo, poi 4 fasi del passo (o del salto) mentre si muove verso destra
import * as THREE from '../vendor/three.module.js?v=2.3.0';
import { INK_UNIFORMS, paperTexture } from '../src/art.js?v=2.3.0';
import { loadModels, makeModel, animateModels, has, STATO } from '../src/modelli.js?v=2.3.0';
const q = new URLSearchParams(location.search), n = q.get('m'), W = 1500, H = 380;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setClearColor(0xe9dfc8); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
INK_UNIFORMS.uPaper.value = paperTexture(); INK_UNIFORMS.uLampR.value = 60; INK_UNIFORMS.uPR.value = 1;
const sc = new THREE.Scene(); const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 4), new THREE.MeshBasicMaterial({ color: 0xd8cbb0 })); floor.rotation.x = -Math.PI / 2; sc.add(floor);
await loadModels('../assets/modelli/'); if (!has(n)) { window.__info = STATO; window.__done = true; throw new Error('manca ' + n); }
const grs = []; for (let i = 0; i < 5; i++) { const g = new THREE.Group(); g.position.x = (i - 2) * 1.3; g.rotation.y = Math.PI / 2 * (q.get('side') === '0' ? 0 : 1); const m = makeModel(n, 1, {}); g.add(m); sc.add(g); grs.push({ g, m }); }
const cam = new THREE.OrthographicCamera(-3.3, 3.3, 0.66, -0.66, 0.1, 50); cam.position.set(0, 0.55, 8); cam.lookAt(0, 0.55, 0); sc.updateMatrixWorld(true);
// simula: il primo resta fermo, gli altri camminano verso destra a velocità piena e vengono fermati a fasi diverse
const dt = 1 / 30; const v = +(q.get('v') || 2.2); for (let f = 0; f < 60; f++) { for (let i = 1; i < 5; i++) grs[i].g.position.x += v * dt; sc.updateMatrixWorld(true); animateModels(dt); INK_UNIFORMS.uTime.value += dt; }
for (let i = 1; i < 5; i++) { grs[i].g.position.x = (i - 2) * 1.3; const a = grs[i].m.userData.anim; a.last = null; a.U.uPh.value += (i - 1) * Math.PI / 2; a.hopT += (i - 1) * Math.PI / 4; } /* stesse condizioni, quattro momenti diversi del passo */
sc.updateMatrixWorld(true); animateModels(1e-4); /* ricalcola salto e schiacciamento per le nuove fasi */
INK_UNIFORMS.uLamp.value.set(0, 0, 0); window.__dbg = { sc, r, cam, THREE }; r.render(sc, cam); window.__info = { tris: STATO.tris[n], ms: STATO.ms, falliti: STATO.falliti }; window.__done = true;
</script></body></html>
